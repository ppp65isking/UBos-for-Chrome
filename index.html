not replace preferences.';content.append(p)}else{const p=document.createElement('p');p.textContent='UBos · Play & Polish. Games: Snake and Minesweeper. More games coming soon. Browser websites may block embedding. Floating controls at the bottom-right move, snap, minimize or close apps; there is no separate title bar.';content.append(p)}}function launcher(){$('#results').replaceChildren();const term=$('#search').value.toLowerCase();for(const [id,[symbol,name]]of Object.entries(apps))if(name.toLowerCase().includes(term))btn(symbol+' '+name,()=>openApp(id),$('#results'));for(const n of notes.filter(n=>!n.deleted&&(n.title+' '+n.text).toLowerCase().includes(term)).slice(0,12))btn('▤ '+(n.title||'Untitled'),()=>{noteId=n.id;notesUI(openApp('notes').querySelector('.body'))},$('#results'))}for(const [id,[symbol,name]]of Object.entries(apps)){const b=btn('',()=>openApp(id),$('#shortcuts'));b.innerHTML='<span>'+symbol+'</span>'+name}$('#start').onclick=()=>{$('#launcher').hidden=!$('#launcher').hidden;launcher();if(!$('#launcher').hidden)$('#search').focus()};$('#search').oninput=launcher;$('#quick').onclick=()=>openApp('settings');function chat(show){$('#chat').hidden=!show;$('#chat-toggle').setAttribute('aria-expanded',String(show))}$('#chat-toggle').onclick=()=>chat($('#chat').hidden);$('#close-chat').onclick=()=>chat(false);$('#float-chat').onclick=()=>$('#chat').classList.toggle('float');$('#try-chat').onclick=()=>$('#chat-frame').src='https://chatgpt.com/';$('#desk').oncontextmenu=e=>{if(e.target.closest('.win'))return;e.preventDefault();const m=$('#menu');m.replaceChildren();for(const id of ['notes','files','games','themes','settings'])btn(apps[id][1],()=>{m.hidden=true;openApp(id)},m);m.hidden=false;m.style.left=Math.min(e.clientX,innerWidth-160)+'px';m.style.top=Math.min(e.clientY,innerHeight-260)+'px'};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu'))$('#menu').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#
