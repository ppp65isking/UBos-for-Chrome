s();if(windows.has('notes'))renderNotes(windows.get('notes').querySelector('.body'));tell('Backup merged. Appearance preferences were not replaced.')}catch(e){tell('Import failed: '+e.message)}})}async function renderStorage(c){c.innerHTML='<h1>Local Storage</h1><p>Files live in this browser, not a cloud drive. Site-data clearing or browser eviction can remove data. Export backups regularly.</p><p class="usage">Checking browser usage…</p><div class="row"></div>';button('Export full backup',backup,c.querySelector('.row'));button('Import backup',importBackup,c.querySelector('.row'));button('Refresh',()=>renderStorage(c),c.querySelector('.row'));button('Request persistent storage',async()=>{const ok=await navigator.storage?.persist?.();tell(ok?'Persistent storage granted. Backups are still recommended.':'Persistence not granted or unavailable.')},c.querySelector('.row'));try{const e=await navigator.storage?.estimate?.();c.querySelector('.usage').textContent=e?'Browser origin estimate: '+((e.usage||0)/1048576).toFixed(2)+' MB used / '+((e.quota||0)/1048576).toFixed(0)+' MB quota. Shared with other pages on this origin.':'Usage estimates unavailable.'}catch{c.querySelector('.usage').textContent='Usage estimate unavailable.'}const p=document.createElement('p');p.className='muted';p.textContent=items.filter(i=>i.type==='file').length+' stored files · '+notes.length+' notes · File database '+(db?'ready':'unavailable');c.append(p)}function renderSettings(c,id){c.innerHTML='<h1>'+names[id]+'</h1>';function field(label,type,key,options){const wrap=document.createElement('label');wrap.className='setting';wrap.append(document.createTextNode(label));const input=document.createElement(type==='select'?'select':'input');if(type==='select')for(const [value,title]of options){const o=document.createElement('option');o.value=value;o.textContent=title;input.append(o)}else input.type=type;if(type==='checkbox')input.checked=!!prefs[key];else input.value=prefs[key]??(key==='accent'?'#baadff':'default');if(type==='range'){input.min=0;input.max=40}input.onchange=()=>{prefs[key]=type==='checkbox'?input.checked:input.value;apply();store('ubos.prefs',prefs)};wrap.append(input);c.append(wrap)}field('Light appearance','checkbox','light');field('Accent','color','accent');field('Wallpaper','select','wall',[['default','Violet tide'],['aurora','Aurora'],['sunset','Sunset']]);field('Glass blur','range','blur');const row=document.createElement('div');row.className='row';c.append(row);button('Upload wallpaper',()=>picker('image/*',false,async files=>{const f=files[0];if(!f?.type.startsWith('image/'))return;if(await put({id:'wallpaper',name:f.name,parent:'system',type:'file',blob:f})){const u=URL.createObjectURL(f);$('#desk').style.backgroundImage='url("'+u+'")';prefs.custom=true;store('ubos.prefs',prefs)}}),row);button('Remove custom wallpaper',()=>{prefs.custom=false;store('ubos.prefs',prefs);apply()},row);if(id==='settings'){field('Reduce motion','checkbox','reduce');field('High contrast','checkbox','contrast');const p=document.createElement('p');p.className='muted';p.textContent='UBos 1.2 · Local data is not encrypted. Browser embedding depends on each website. ChatGPT icon is loaded from the official website favicon with a text fallback.';c.append(p)}}function launcher(){$('#results').replaceChildren();const term=$('#search').value.toLowerCase();for(const [id,name]of Object.entries(names))if(name.toLowerCase().includes(term)){const b=button(name,()=>open(id),$('#results'));b.innerHTML=icon(id)+' '+name}for(const n of notes.filter(n=>!n.deleted&&(n.title+' '+n.text).toLowerCase().includes(term)).slice(0,15))button('Note: '+(n.title||'Untitled'),()=>{noteId=n.id;const w=open('notes');renderNotes(w.querySelector('.body'))},$('#results'))}for(const id of Object.keys(names)){const b=button('',()=>open(id),$('#shortcuts'));b.innerHTML=icon(id)+names[id]}$('#start').onclick=()=>{$('#launcher').hidden=!$('#launcher').hidden;launcher();if(!$('#launcher').hidden)$('#search').focus()};$('#search').oninput=launcher;$('#quick').onclick=()=>open('settings');function toggleChat(show){$('#chat-panel').hidden=!show;$('#chat-toggle').setAttribute('aria-expanded',String(show))}$('#chat-toggle').onclick=()=>toggleChat($('#chat-panel').hidden);$('#close-chat').onclick=()=>toggleChat(false);$('#float-chat').onclick=()=>{const f=$('#chat-panel').classList.toggle('floating');$('#float-chat').textContent=f?'Sidebar':'Float'};$('#try-chat').onclick=()=>$('#chat-frame').src='https://chatgpt.com/';$('#desk').oncontextmenu=e=>{if(e.target.closest('.win'))return;e.preventDefault();const m=$('#menu');m.replaceChildren();for(const [text,fn]of [['New note',()=>{notes.unshift({id:uid(),title:'Untitled',text:'',updated:Date.now()});noteId=notes[0].id;saveNotes();const w=open('notes');renderNotes(w.querySelector('.body'))}],['New folder',async()=>{const name=prompt('Folder name');if(name?.trim())await put({id:uid(),name:name.trim(),parent:'root',type:'folder',deleted:false});open('files')}],['Wallpaper',()=>open('themes')],['Settings',()=>open('settings')]])button(text,()=>{m.hidden=true;fn()},m);m.hidden=false;m.style.left=Math.min(e.clientX,innerWidth-180)+'px';m.style.top=Math.min(e.clientY,innerHeight-240)+'px'};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu'))$('#menu').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#launcher').hidden=true;$('#menu').hidden=true;toggleChat(false)}});window.addEventListener('beforeunload',()=>{for(const w of windows.values())if(!w.hidden)remember(w)});function clock(){$('#clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,1000);initDB().then(async()=>{await reloadItems();const wall=items.find(i=>i.id==='wallpaper');if(prefs.custom&&wall?.blob){const u=URL.createObjectURL(wall.blob);$('#desk').style.backgroundImage='url("'+u+'")'}}).catch(e=>tell('File storage unavailable: '+e.message));launcher();
