<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBos for Chrome</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:var(--text);--text:#f5f5ff;--panel:#202238b8;--input:#ffffff12;--accent:#b5adff;background:#16152b;overflow:hidden}body.light{--text:#23213a;--panel:#ffffffb8;--input:#00000009}button,input,textarea,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:var(--input);border:1px solid #ffffff22;border-radius:14px;padding:10px 15px}button:hover{background:#a49bff40}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent)}#desktop{height:100dvh;background:radial-gradient(ellipse at 20% 20%,#8d79dc88,transparent 60%),radial-gradient(ellipse at 85% 70%,#438eae88,transparent 65%)}body[data-wall=aurora] #desktop{background:radial-gradient(ellipse at 15% 25%,#3cb9a999,transparent 60%),radial-gradient(ellipse at 85% 70%,#5f4dbe99,transparent 65%)}body[data-wall=sunset] #desktop{background:radial-gradient(ellipse at 20% 20%,#e9967299,transparent 60%),radial-gradient(ellipse at 85% 70%,#9c438d99,transparent 65%)}header{height:44px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:var(--panel);backdrop-filter:blur(28px);border-bottom:1px solid #ffffff18}#icons{display:flex;flex-direction:column;gap:12px;padding:22px;width:115px}#icons button{background:transparent;border:0;padding:8px;font-size:12px}#icons span{display:block;font-size:30px;margin-bottom:6px}.glass{background:var(--panel);backdrop-filter:blur(32px) saturate(150%);border:1px solid #ffffff35;box-shadow:0 24px 80px #0005}#dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:9px;border-radius:25px;z-index:9999}#dock button{font-size:23px;width:49px;padding:8px;border:0}#dock button.running{box-shadow:inset 0 -3px var(--accent)}.window{position:absolute;top:90px;left:160px;width:650px;height:440px;min-width:300px;min-height:260px;border-radius:22px;overflow:hidden;resize:both;display:flex;flex-direction:column}.window.max{top:50px!important;left:8px!important;width:calc(100vw - 16px)!important;height:calc(100dvh - 145px)!important;resize:none}.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 20px;cursor:grab;touch-action:none;border-bottom:1px solid #ffffff18;user-select:none}.bar button{padding:5px 11px;border:0}.bar .close:hover{background:#e9536a}.content{padding:20px;overflow:auto;flex:1}.row{display:flex;gap:10px;align-items:center;margin-bottom:14px}.content h1{font-size:30px;margin:0 0 10px}.muted{opacity:.65}.notes{display:flex;gap:14px;height:100%}.list{width:155px;flex-shrink:0;overflow:auto}.list button{display:block;width:100%;text-align:left;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.editor{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}input,textarea,select{background:var(--input);border:1px solid #ffffff22;border-radius:12px;padding:11px}textarea{resize:none;flex:1;min-height:100px}input{width:100%}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.file{padding:18px;border-radius:18px;background:var(--input);overflow-wrap:anywhere}.file span{font-size:30px;display:block;margin-bottom:8px}#launcher{position:fixed;bottom:98px;left:50%;transform:translateX(-50%);width:min(430px,95vw);border-radius:25px;padding:24px;z-index:10000}#launcher[hidden]{display:none}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.apps button{padding:18px 8px}.welcome{position:absolute;right:6%;top:15%;pointer-events:none}.welcome h1{font-size:clamp(28px,5vw,64px);margin:0;letter-spacing:-3px}.welcome p{opacity:.65}.badge{display:inline-block;background:var(--accent);color:#202038;padding:7px 14px;border-radius:20px}.setting{margin:20px 0}.setting label{display:block;margin-bottom:8px}select{width:100%}@media(max-width:650px){.window{left:8px!important;top:55px!important;width:calc(100vw - 16px);height:calc(100dvh - 150px)}.welcome{display:none}.notes{flex-direction:column}.list{width:100%;max-height:100px}.list button{display:inline-block;width:120px}.editor{min-height:150px}#dock{gap:1px;padding:6px}#dock button{width:44px}}body.reduce *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
</style></head><body><main id="desktop"><header><b>UBos <small class="muted">for Chrome</small></b><time id="clock"></time></header><div id="icons"></div><div class="welcome"><h1>Your space.<br>Your rhythm.</h1><p>A little OS. A lot of possibility.</p></div><section id="launcher" class="glass" hidden><h2>Make yourself at home.</h2><div class="apps" id="apps"></div></section><nav id="dock" class="glass" aria-label="App dock"><button id="start" title="Open app launcher">✦</button></nav></main><script>
const $=s=>document.querySelector(s),defs={notes:['📝','Notes'],files:['📁','File Explorer'],storage:['💾','Storage'],themes:['🎨','Themes'],settings:['⚙️','Settings']};let z=10,activeNote,saveError=false;function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}let notes=load('ubos.notes',[{id:'welcome',title:'Welcome to UBos',text:'Your ideas belong here. Notes save in this browser automatically.'}]),prefs=load('ubos.prefs',{light:false,accent:'#b5adff',wall:'default',reduce:false});function persist(k,v){try{localStorage.setItem(k,JSON.stringify(v));saveError=false}catch{saveError=true;alert('Could not save. Browser storage may be unavailable or full. Export your notes to keep a copy.')}}function apply(){document.body.classList.toggle('light',prefs.light);document.body.classList.toggle('reduce',prefs.reduce);document.body.dataset.wall=prefs.wall;document.body.style.setProperty('--accent',prefs.accent)}apply();function escapeText(v){const e=document.createElement('span');e.textContent=v;return e.innerHTML}function save(){persist('ubos.notes',notes)}function exportNotes(){const u=URL.createObjectURL(new Blob([JSON.stringify(notes,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='UBos-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function openApp(id){$('#launcher').hidden=true;let w=document.getElementById('win-'+id);if(w){w.hidden=false;w.style.zIndex=++z;return}w=document.createElement('section');w.id='win-'+id;w.className='window glass';w.setAttribute('aria-label',defs[id][1]);w.style.left=(140+Object.keys(defs).indexOf(id)*25)+'px';w.style.top=(75+Object.keys(defs).indexOf(id)*20)+'px';w.innerHTML='<div class="bar"><span>'+defs[id].join(' ')+'</span><div><button title="Minimize" data-act="min">−</button><button title="Maximize or restore" data-act="max">□</button><button title="Close" data-act="close" class="close">×</button></div></div><div class="content"></div>';$('#desktop').append(w);$('#dock-'+id).classList.add('running');w.style.zIndex=++z;w.addEventListener('pointerdown',()=>w.style.zIndex=++z);w.querySelector('[data-act=min]').onclick=()=>w.hidden=true;w.querySelector('[data-act=max]').onclick=()=>w.classList.toggle('max');w.querySelector('[data-act=close]').onclick=()=>{w.remove();$('#dock-'+id).classList.remove('running')};const bar=w.querySelector('.bar');bar.onpointerdown=e=>{if(e.target.closest('button')||w.classList.contains('max')||innerWidth<=650)return;const x=e.clientX,y=e.clientY,l=w.offsetLeft,t=w.offsetTop;bar.setPointerCapture(e.pointerId);bar.onpointermove=p=>{w.style.left=Math.max(0,Math.min(innerWidth-100,l+p.clientX-x))+'px';w.style.top=Math.max(44,Math.min(innerHeight-120,t+p.clientY-y))+'px'};bar.onpointerup=()=>bar.onpointermove=null;bar.onpointercancel=()=>bar.onpointermove=null};render(id,w.querySelector('.content'))}function render(id,c){if(id==='notes'){c.innerHTML='<div class="notes"><aside class="list"><button id="new-note">＋ New note</button><div id="note-list"></div></aside><div class="editor"><input id="note-title" aria-label="Note title" placeholder="Title"><textarea id="note-body" aria-label="Note content" placeholder="Write something…"></textarea><div class="row"><button id="delete-note">Delete</button><button id="export-note">Export all</button></div><small class="muted">Saved on this browser only. Export for backup.</small></div></div>';function list(){const box=c.querySelector('#note-list');box.replaceChildren();notes.forEach(n=>{const b=document.createElement('button');b.textContent=n.title||'Untitled';b.onclick=()=>select(n.id);box.append(b)})}function select(nid){activeNote=nid;const n=notes.find(n=>n.id===nid);c.querySelector('#note-title').value=n?.title||'';c.querySelector('#note-body').value=n?.text||'';c.querySelector('#note-title').disabled=!n;c.querySelector('#note-body').disabled=!n}c.querySelector('#new-note').onclick=()=>{const n={id:crypto.randomUUID(),title:'Untitled',text:''};notes.unshift(n);save();list();select(n.id)};for(const [sel,key]of [['#note-title','title'],['#note-body','text']])c.querySelector(sel).oninput=e=>{const n=notes.find(n=>n.id===activeNote);if(n){n[key]=e.target.value;save();if(key==='title')list()}};c.querySelector('#delete-note').onclick=()=>{if(!activeNote||!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==activeNote);save();list();select(notes[0]?.id)};c.querySelector('#export-note').onclick=exportNotes;list();select(notes[0]?.id)}else if(id==='files'){c.innerHTML='<h1>File Explorer</h1><p class="muted">UBos / Notes · Virtual files stored in this browser</p><div class="row"><button id="refresh-files">Refresh</button><button id="backup-files">Export notes</button></div><div class="files"></div><p class="muted">This explorer does not access your computer’s files.</p>';const grid=c.querySelector('.files');notes.forEach(n=>{const b=document.createElement('button');b.className='file';b.innerHTML='<span>📄</span>'+escapeText(n.title||'Untitled')+'.txt';b.onclick=()=>{openApp('notes');const nc=$('#win-notes .content');const btn=[...nc.querySelectorAll('#note-list button')][notes.indexOf(n)];btn?.click()};grid.append(b)});if(!notes.length)grid.textContent='No notes yet.';c.querySelector('#refresh-files').onclick=()=>render(id,c);c.querySelector('#backup-files').onclick=exportNotes}else if(id==='storage'){c.innerHTML='<span class="badge">Coming soon</span><h1 style="margin-top:24px">Room for everything.</h1><p>Dedicated UBos storage is on the roadmap.</p><p class="muted">For now, Notes and preferences save locally in this browser. There is no cloud sync or dedicated storage service yet.</p>'}else{c.innerHTML='<h1>'+defs[id][1]+'</h1><p class="muted">Make this space feel like you.</p><div class="setting"><label for="mode">Appearance</label><select id="mode"><option value="dark">Dark glass</option><option value="light">Light glass</option></select></div><div class="setting"><label for="wall">Wallpaper</label><select id="wall"><option value="default">Violet tide</option><option value="aurora">Aurora</option><option value="sunset">Sunset</option></select></div><div class="setting"><label for="accent">Accent color</label><input id="accent" type="color"></div>'+(id==='settings'?'<div class="setting"><label><input id="motion" type="checkbox" style="width:auto"> Reduce motion</label></div><p class="muted">UBos 0.1 · Browser desktop prototype. Local data is not encrypted. Clearing browser site data removes saved notes and preferences.</p>':'');c.querySelector('#mode').value=prefs.light?'light':'dark';c.querySelector('#wall').value=prefs.wall;c.querySelector('#accent').value=prefs.accent;for(const [sel,key,fn]of [['#mode','light',e=>e.target.value==='light'],['#wall','wall',e=>e.target.value],['#accent','accent',e=>e.target.value]])c.querySelector(sel).onchange=e=>{prefs[key]=fn(e);apply();persist('ubos.prefs',prefs)};if(id==='settings'){c.querySelector('#motion').checked=prefs.reduce;c.querySelector('#motion').onchange=e=>{prefs.reduce=e.target.checked;apply();persist('ubos.prefs',prefs)}}}}for(const [id,[icon,name]]of Object.entries(defs)){for(const target of ['#icons','#apps','#dock']){const b=document.createElement('button');b.title=name;b.setAttribute('aria-label',name);b.innerHTML=target==='#dock'?icon:'<span>'+icon+'</span> '+name;if(target==='#dock')b.id='dock-'+id;b.onclick=()=>openApp(id);$(target).append(b)}}$('#start').onclick=()=>$('#launcher').hidden=!$('#launcher').hidden;document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#launcher').hidden=true});function clock(){$('#clock').textContent=new Date().toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,1000);
</script></body></html>
