[build]
  publish = "."

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/runtime/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cache-Control = "no-cache"

