<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBos Browser 1.4</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Google Sans',system-ui,sans-serif;color:var(--fg);background:var(--bg);--bg:#191b28;--fg:#eef0ff;--chrome:#252837;--surface:#303447;--accent:#bec4ff;--line:#ffffff18}body.light{--bg:#f7f8ff;--fg:#242638;--chrome:#e6e9f5;--surface:#fff;--accent:#4c57b8;--line:#00000018}button,input{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:0;border-radius:12px;padding:9px}button:hover{background:var(--line)}button:disabled{opacity:.3;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#chrome{background:var(--chrome);flex-shrink:0;padding:7px 8px 0;border-bottom:1px solid var(--line)}#tabrow{display:flex;align-items:center;gap:5px}#tabstrip{display:flex;gap:4px;flex:1;min-width:0;overflow:auto;scrollbar-width:thin}.tab{display:flex;align-items:center;min-width:105px;max-width:200px;flex:1;background:var(--line);border-radius:13px 13px 0 0}.tab.active{background:var(--surface);box-shadow:inset 0 2px var(--accent)}.tab .choose{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:12px;padding:11px}.tab .close{padding:7px;border-radius:50%}#navigation{display:flex;gap:4px;align-items:center;padding:7px 0}#addressbox{display:flex;align-items:center;gap:8px;flex:1;min-width:80px;border-radius:24px;background:var(--surface);padding:0 10px}#address{background:none;border:0;outline:none;width:100%;padding:11px 0;min-width:0}#addressbox:focus-within{outline:2px solid var(--accent)}#go{font-size:12px}#bookmarkbar{display:flex;gap:5px;overflow:auto;white-space:nowrap;max-height:37px}#bookmarkbar button{font-size:12px;padding:7px 10px}#workspace{position:relative;flex:1;min-height:0;overflow:hidden}.webframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}#home{height:100%;overflow:auto;text-align:center;padding:clamp(20px,6vw,65px) 20px;background:radial-gradient(ellipse at top,#7581c922,transparent 70%)}#home h1{font-size:clamp(38px,7vw,68px);font-weight:500;letter-spacing:-3px;margin:18px 0 8px}#home .subtitle{opacity:.65;margin-bottom:28px}#home-search{display:flex;gap:8px;align-items:center;max-width:600px;margin:0 auto 25px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:8px 14px;box-shadow:0 12px 35px #0001}#query{flex:1;min-width:0;background:none;border:0;padding:10px}#shortcuts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;max-width:680px;margin:auto}.shortcut{width:104px;position:relative}.shortcut .visit{width:100%;padding:14px 5px}.shortcut .bubble{display:grid;place-items:center;background:var(--surface);border-radius:20px;width:50px;height:50px;margin:0 auto 9px;font-size:23px}.shortcut .edit{font-size:11px;opacity:.65}#status{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;padding:7px 12px;background:var(--chrome);border-top:1px solid var(--line);flex-shrink:0}#status span{opacity:.7}#panel{position:absolute;top:8px;right:8px;bottom:8px;width:min(380px,calc(100% - 16px));z-index:20;border:1px solid var(--line);background:var(--chrome);box-shadow:0 15px 60px #0005;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}#panel-head{padding:15px;display:flex;align-items:center;justify-content:space-between}#panel-body{overflow:auto;padding:0 15px 15px;flex:1}.entry{padding:12px;background:var(--surface);border-radius:14px;margin-bottom:8px;overflow-wrap:anywhere}.entry .actions{display:flex;gap:5px;margin-top:6px}.entry small{opacity:.65;display:block;margin-top:5px}.entry button{font-size:12px}#panel-body input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;margin-bottom:12px}a{color:var(--accent)}#message{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:var(--surface);padding:12px 18px;border:1px solid var(--line);border-radius:15px;z-index:40;max-width:90vw}body.contrast{--bg:#000;--fg:#fff;--chrome:#111;--surface:#222;--accent:#ffff00;--line:#ffffff66}[hidden]{display:none!important}@media(max-width:500px){#navigation{flex-wrap:wrap}#addressbox{order:-1;flex-basis:100%}#status span{max-width:70%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.tab{min-width:90px}.tab .choose{max-width:110px}#home h1{letter-spacing:-2px}}
</style></head><body><main id="app"><div id="chrome"><div id="tabrow"><div id="tabstrip" aria-label="Tabs"></div><button id="add-tab" title="New tab" aria-label="New tab">＋</button><button id="reopen" title="Reopen last closed tab" aria-label="Reopen last closed tab">↶</button><button id="menu" title="Browser menu" aria-label="Browser menu">⋮</button></div><form id="navigation"><button id="back" type="button" aria-label="Previous entered address"></button><button id="forward" type="button" aria-label="Next entered address"></button><button id="reload" type="button" aria-label="Reload page"></button><button id="home-button" type="button" aria-label="New-tab home"></button><div id="addressbox"><span id="address-icon" aria-hidden="true"></span><input id="address" aria-label="HTTPS address or search" placeholder="Search or enter an HTTPS address" autocomplete="off" spellcheck="false"><button id="go" type="submit">Go</button><button id="star" type="button" title="Bookmark address" aria-label="Bookmark address">☆</button></div><button id="external" type="button" aria-label="Open current address in Chrome" title="Open in Chrome"></button></form><nav id="bookmarkbar" aria-label="Bookmarks"></nav></div><section id="workspace"><section id="home"><h1>UBos Browser</h1><p class="subtitle">A quieter space for the web. · 1.4</p><form id="home-search"><span id="search-icon" aria-hidden="true"></span><input id="query" aria-label="Search the web or enter an address" placeholder="Search the web or enter an address"><button type="submit">Search ↗</button></form><div id="shortcuts"></div><p style="opacity:.6;font-size:12px;margin-top:28px">Search opens in Chrome. Embedded websites must allow framing.</p></section><aside id="panel" hidden><div id="panel-head"><strong id="panel-title"></strong><button id="panel-close" aria-label="Close panel">×</button></div><div id="panel-body"></div></aside></section><footer id="status"><span>UBos addresses only · Some websites block embedding.</span><button id="fallback">Open in Chrome ↗</button></footer></main><div id="message" hidden role="status"></div><script>
'use strict';const q=s=>document.querySelector(s);const shapes={back:'M15 5l-7 7 7 7',forward:'M9 5l7 7-7 7',reload:'M20 7v5h-5 M20 12a8 8 0 1 0-2 6',home:'M3 11l9-8 9 8 M5 10v11h5v-7h4v7h5V10',external:'M14 3h7v7 M21 3L10 14 M10 4H4v16h16v-6',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6',globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M3 12h18 M12 3c-5 6-5 12 0 18 M12 3c5 6 5 12 0 18'};function ico(k){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+shapes[k]+'"/></svg>'}for(const id of ['back','forward','reload','external'])q('#'+id).innerHTML=ico(id);q('#home-button').innerHTML=ico('home');q('#address-icon').innerHTML=ico('globe');q('#search-icon').innerHTML=ico('search');function valid(s){try{const u=new URL(s);return u.protocol==='https:'&&!u.username&&!u.password}catch{return false}}function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}let timer;function message(s){q('#message').textContent=s;q('#message').hidden=false;clearTimeout(timer);timer=setTimeout(()=>q('#message').hidden=true,4000)}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{message('Local save failed. Browser storage may be full or unavailable.')}}let marks=read('ubos.browser.bookmarks',[]);marks=Array.isArray(marks)?marks.filter(x=>typeof x==='string'&&valid(x)):[];let recent=read('ubos.browser.history',[]);recent=Array.isArray(recent)?recent.filter(x=>x&&valid(x.url)&&typeof x.time==='number').slice(0,150):[];let shortcuts=read('ubos.browser.shortcuts',[{name:'Google',url:'https://www.google.com/'},{name:'ChatGPT',url:'https://chatgpt.com/'},{name:'GitHub',url:'https://github.com/'}]);shortcuts=Array.isArray(shortcuts)?shortcuts.filter(x=>x&&typeof x.name==='string'&&valid(x.url)):[];let tabs=[],closed=[],seq=0,active;function current(){return tabs.find(t=>t.id===active)}function address(t){return t.history[t.position]||''}function external(u){if(valid(u))window.open(u,'_blank','noopener,noreferrer')}function addButton(text,fn,parent){const b=document.createElement('button');b.textContent=text;b.onclick=fn;parent.append(b);return b}function createTab(state){const t={id:++seq,history:state?.history?.slice()||[''],position:state?.position||0,frame:null,loaded:''};tabs.push(t);active=t.id;paint();return t}window.makeTab=()=>createTab();function closeTab(id){const i=tabs.findIndex(t=>t.id===id),t=tabs[i];if(!t)return;closed.push({history:t.history.slice(),position:t.position});closed=closed.slice(-20);t.frame?.remove();tabs.splice(i,1);if(!tabs.length){createTab();return}if(active===id)active=tabs[Math.min(i,tabs.length-1)].id;paint()}function reopen(){const t=closed.pop();if(t)createTab(t)}function ensureFrame(t){if(t.frame)return t.frame;const f=document.createElement('iframe');f.className='webframe';f.title='Website in UBos tab '+t.id;f.hidden=true;f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads');f.referrerPolicy='strict-origin-when-cross-origin';q('#workspace').insertBefore(f,q('#panel'));t.frame=f;return f}function paint(){const t=current(),u=address(t);q('#tabstrip').replaceChildren();for(const tab of tabs){const d=document.createElement('div');d.className='tab'+(tab.id===active?' active':'');const name=address(tab)?new URL(address(tab)).hostname:'New tab';const b=addButton(name,()=>{active=tab.id;paint()},d);b.className='choose';b.title=name;b.setAttribute('aria-pressed',String(tab.id===active));const c=addButton('×',()=>closeTab(tab.id),d);c.className='close';c.setAttribute('aria-label','Close '+name);q('#tabstrip').append(d);if(tab.frame)tab.frame.hidden=true}q('#home').hidden=!!u;if(u){const f=ensureFrame(t);f.hidden=false;if(t.loaded!==u){f.src=u;t.loaded=u}}q('#address').value=u;q('#back').disabled=t.position===0;q('#forward').disabled=t.position>=t.history.length-1;q('#reload').disabled=q('#external').disabled=q('#fallback').disabled=q('#star').disabled=!u;q('#star').textContent=marks.includes(u)?'★':'☆';q('#reopen').disabled=!closed.length;paintMarks()}function navigate(u){if(!valid(u)){message('Use an HTTPS address without embedded credentials.');return}const t=current();t.history=t.history.slice(0,t.position+1);t.history.push(u);t.position++;recent.unshift({url:u,time:Date.now()});recent=recent.slice(0,150);save('ubos.browser.history',recent);paint();q('#panel').hidden=true}function submit(raw){raw=raw.trim();if(!raw)return;if(/^[a-z][a-z0-9+.-]*:/i.test(raw)){navigate(raw);return}if(/^[^\s/]+\.[^\s/]+(?:\/.*)?$/.test(raw)){navigate('https://'+raw);return}external('https://www.google.com/search?q='+encodeURIComponent(raw))}q('#navigation').onsubmit=e=>{e.preventDefault();submit(q('#address').value)};q('#home-search').onsubmit=e=>{e.preventDefault();submit(q('#query').value)};q('#add-tab').onclick=()=>createTab();q('#reopen').onclick=reopen;q('#back').onclick=()=>{const t=current();if(t.position){t.position--;paint()}};q('#forward').onclick=()=>{const t=current();if(t.position<t.history.length-1){t.position++;paint()}};q('#reload').onclick=()=>{const t=current();if(t.frame&&address(t))t.frame.src=address(t)};q('#home-button').onclick=()=>{const t=current();t.history=t.history.slice(0,t.position+1);t.history.push('');t.position++;paint()};q('#external').onclick=q('#fallback').onclick=()=>external(address(current()));q('#star').onclick=()=>{const u=address(current());if(!u)return;marks=marks.includes(u)?marks.filter(x=>x!==u):[...marks,u];save('ubos.browser.bookmarks',marks);q('#star').textContent=marks.includes(u)?'★':'☆';paintMarks()};function paintMarks(){q('#bookmarkbar').replaceChildren();for(const u of marks)addButton(new URL(u).hostname,()=>navigate(u),q('#bookmarkbar')).title=u}function paintShortcuts(){q('#shortcuts').replaceChildren();shortcuts.forEach((s,i)=>{const d=document.createElement('div');d.className='shortcut';const b=addButton('',()=>navigate(s.url),d);b.className='visit';const bubble=document.createElement('span');bubble.className='bubble';bubble.textContent=s.name.slice(0,1).toUpperCase();const label=document.createElement('span');label.textContent=s.name;b.append(bubble,label);const edit=addButton('Edit',()=>editShortcut(i),d);edit.className='edit';q('#shortcuts').append(d)});addButton('＋ Add shortcut',()=>editShortcut(),q('#shortcuts'))}function editShortcut(i){const old=shortcuts[i],name=prompt('Shortcut name',old?.name||'');if(name===null)return;if(!name.trim()&&old){if(confirm('Delete this shortcut?'))shortcuts.splice(i,1)}else if(name.trim()){let u=prompt('HTTPS address',old?.url||'https://');if(u===null)return;if(!valid(u)){message('Enter a valid HTTPS address.');return}const s={name:name.trim(),url:u};if(old)shortcuts[i]=s;else shortcuts.push(s)}save('ubos.browser.shortcuts',shortcuts);paintShortcuts()}function panel(title){q('#panel-title').textContent=title;q('#panel-body').replaceChildren();q('#panel').hidden=false;return q('#panel-body')}function entry(label,url,parent){const d=document.createElement('div');d.className='entry';const strong=document.createElement('strong');strong.textContent=label;const small=document.createElement('small');small.textContent=url;const actions=document.createElement('div');actions.className='actions';d.append(strong,small,actions);parent.append(d);return actions}function bookmarksPanel(){const p=panel('Bookmarks');addButton('Bookmark current address',()=>{const u=address(current());if(u&&!marks.includes(u)){marks.push(u);save('ubos.browser.bookmarks',marks);paintMarks();bookmarksPanel()}},p);const search=document.createElement('input');search.placeholder='Filter bookmarks';search.setAttribute('aria-label','Filter bookmarks');p.append(search);const list=document.createElement('div');p.append(list);function draw(){list.replaceChildren();for(const u of marks.filter(u=>u.toLowerCase().includes(search.value.toLowerCase()))){const actions=entry(new URL(u).hostname,u,list);addButton('Open',()=>navigate(u),actions);addButton('Edit URL',()=>{const value=prompt('Bookmark HTTPS address',u);if(value===null)return;if(!valid(value)){message('Invalid HTTPS address.');return}marks=marks.map(x=>x===u?value:x);save('ubos.browser.bookmarks',marks);paintMarks();draw()},actions);addButton('Remove',()=>{marks=marks.filter(x=>x!==u);save('ubos.browser.bookmarks',marks);paintMarks();draw()},actions)}}search.oninput=draw;draw()}function historyPanel(){const p=panel('Recent entered addresses');const help=document.createElement('p');help.textContent='Only addresses entered through UBos are recorded. Links clicked inside external websites are not tracked.';p.append(help);addButton('Clear history',()=>{if(confirm('Clear UBos entered-address history?')){recent=[];save('ubos.browser.history',recent);historyPanel()}},p);for(const r of recent){const a=entry(new Date(r.time).toLocaleString(),r.url,p);addButton('Open',()=>navigate(r.url),a);addButton('Remove',()=>{recent=recent.filter(x=>x!==r);save('ubos.browser.history',recent);historyPanel()},a)}}q('#menu').onclick=()=>{const p=panel('Browser · 1.4');addButton('Bookmarks',bookmarksPanel,p);addButton('Recent addresses',historyPanel,p);addButton('Reopen closed tab',reopen,p);addButton('Open ChatGPT ↗',()=>external('https://chatgpt.com/'),p);if(window.parent===window){const a=document.createElement('a');a.href='index.html';a.textContent='Return to UBos desktop';a.style.display='block';a.style.margin='15px 0';p.append(a)}const text=document.createElement('p');text.textContent='This is a browser UI running inside Chrome. It cannot override website framing rules or installed extensions. Google Sans falls back to your system font when unavailable.';text.style.fontSize='12px';p.append(text)};q('#panel-close').onclick=()=>q('#panel').hidden=true;function appearance(){let p=read('ubos.prefs',{});if(!p||typeof p!=='object')p={};document.body.classList.toggle('light',!!p.light);document.body.classList.toggle('contrast',!!p.contrast)}window.addEventListener('storage',appearance);appearance();document.addEventListener('keydown',e=>{if(e.key==='Escape')q('#panel').hidden=true;if(e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();createTab()}if(e.altKey&&e.shiftKey&&e.key.toLowerCase()==='r'){e.preventDefault();reopen()}});paintShortcuts();createTab();
