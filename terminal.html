<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBos Terminal 1.7</title><style>*{box-sizing:border-box}body{margin:0;background:#111c2c;color:#d9e9ff;font:13px ui-monospace,SFMono-Regular,Consolas,monospace;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #ffffff20;background:#ffffff08;flex-wrap:wrap}header strong{flex:1}button{font:inherit;color:inherit;background:#ffffff0d;border:1px solid #ffffff25;border-radius:12px;padding:7px 10px;cursor:pointer}#output{flex:1;min-height:0;overflow:auto;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.error{color:#ffb4bd}.command{color:#a5ebc9}form{display:flex;align-items:center;gap:8px;padding:12px 15px 55px;border-top:1px solid #ffffff18}#prompt{color:#99dabd;max-width:35%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}input{font:inherit;color:inherit;background:transparent;border:0;outline:none;flex:1;min-width:0;padding:7px}form:focus-within{box-shadow:inset 0 2px #9cbfff}small{opacity:.6}button:focus-visible{outline:2px solid #b9caff}</style></head><body><header><strong>&gt;_ Terminal · 1.7</strong><button id="help">Help</button><button id="clear">Clear</button><button id="settings">Developer settings</button></header><div id="output" aria-label="Terminal output" tabindex="0"></div><form id="form"><span id="prompt">/$</span><input id="input" aria-label="Terminal command" autocomplete="off" spellcheck="false" placeholder="Type help"><button id="run" type="submit">Run</button></form><script>
'use strict';const q=s=>document.querySelector(s),out=q('#output');let api;try{api=parent.ubosTerminal}catch{}let cwd='root',history=[],position=0,busy=false;function print(text,cls=''){const line=document.createElement('div');line.className=cls;line.textContent=String(text);out.append(line);while(out.children.length>600)out.firstChild.remove();out.scrollTop=out.scrollHeight}function tokens(s){const result=[];const re=/"([^"]*)"|'([^']*)'|(\S+)/g;let m;while((m=re.exec(s)))result.push(m[1]??m[2]??m[3]);return result}async function entries(){return api.files()}async function path(id){const all=await entries(),parts=[];let n=0;while(id!=='root'&&n++<50){const item=all.find(i=>i.id===id);if(!item)return '/';parts.unshift(item.name);id=item.parent}return '/'+parts.join('/')}async function resolve(value='.',wantParent=false){const all=await entries(),parts=value.split('/').filter(Boolean);let id=value.startsWith('/')?'root':cwd;const name=wantParent?parts.pop():null;for(const part of parts){if(part==='.')continue;if(part==='..'){id=all.find(i=>i.id===id)?.parent||'root';continue}const item=all.find(i=>i.parent===id&&i.name===part);if(!item)throw new Error('Path not found: '+part);id=item.id}if(wantParent){if(!name)throw new Error('Missing filename');return{id,name}}return id}async function json(url){return JSON.parse(await api.network(url))}async function clone(repo,destination,branch){if(!api.permissions().internet)throw new Error('Enable Terminal internet in Settings > Developer');let owner,name;if(repo.startsWith('https://')){const u=new URL(repo);if(u.hostname!=='github.com')throw new Error('Use a github.com repository');[owner,name]=u.pathname.split('/').filter(Boolean)}else [owner,name]=repo.split('/');name=name?.replace(/\.git$/,'');if(!/^[a-zA-Z0-9_.-]+$/.test(owner||'')||!name||!/^[a-zA-Z0-9_.-]+$/.test(name))throw new Error('Usage: clone owner/repo [destination] [branch]');const base='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(name),metadata=await json(base);branch=branch||metadata.default_branch;const tree=await json(base+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1');if(tree.truncated)throw new Error('Repository tree truncated; snapshot aborted');const files=tree.tree.filter(i=>i.type==='blob'&&['100644','100755'].includes(i.mode));if(files.length>40)throw new Error('Repository has '+files.length+' files. Limit: 40 files; no partial clone written.');if(files.reduce((n,i)=>n+(i.size||0),0)>8388608)throw new Error('Repository exceeds 8 MB snapshot limit');print('Downloading '+files.length+' files from '+owner+'/'+name+' @ '+branch+'…');const downloads=[];for(let n=0;n<files.length;n++){const f=files[n];if(f.size>1400000)throw new Error('File too large for this snapshot: '+f.path);const blob=await json(base+'/git/blobs/'+f.sha);if(blob.encoding!=='base64')throw new Error('Unsupported blob encoding');downloads.push({path:f.path,data:blob.content});print((n+1)+'/'+files.length+' '+f.path)}await api.snapshot(destination||name,downloads);print('Snapshot saved to /'+(destination||name)+'. No .git history, symlinks or submodules. API rate limits apply.')}async function execute(line){const a=tokens(line),cmd=a.shift()?.toLowerCase();if(!cmd)return;if(!api)throw new Error('Open Terminal from inside the main UBos desktop.');switch(cmd){case 'help':print('UBos virtual shell. Not Bash; no pipes, redirection, npm, Node or native programs.\n\nhelp                     Show commands\nclear                    Clear output\npwd                      Current folder\nls [path]                List virtual files\ncd [path]                Change directory\nmkdir name               Create folder in current directory\ntouch path               Create empty file (does not overwrite)\ncat path                 Read text file, up to 1 MB\nwrite path "text"        Write/replace text file\necho text                Print text\nrm path                  Move file to Trash\nfetch https://host/path  Read up to 2 MB via HTTPS/CORS\nclone owner/repo [dir] [branch]\n                         Public GitHub snapshot to Home; max 40 files / 8 MB\ninstall path.html [name]  Install self-contained HTML app (unstable)\napps                     List app IDs\nopen app-id              Open an app\npermissions              Show developer permissions\n\nExamples:\nmkdir demo\nwrite demo/hello.txt "Hello UBos"\ncat demo/hello.txt\nclone owner/small-repo\ninstall /small-repo/index.html MyApp');break;case 'clear':out.replaceChildren();break;case 'pwd':print(await path(cwd));break;case 'echo':print(a.join(' '));break;case 'permissions':print(JSON.stringify(api.permissions(),null,2));break;case 'ls':{const id=await resolve(a[0]||'.'),all=await entries(),item=all.find(i=>i.id===id);if(item&&item.type!=='folder'){print(item.name+' · '+item.size+' bytes');break}const list=all.filter(i=>i.parent===id);print(list.length?list.map(i=>(i.type==='folder'?'[dir] ':'[file] ')+i.name+(i.type==='file'?' · '+i.size+' bytes':'')).join('\n'):'(empty)');break}case 'cd':{const id=await resolve(a[0]||'/'),all=await entries();if(id!=='root'&&!all.some(i=>i.id===id&&i.type==='folder'))throw new Error('Not a directory');cwd=id;break}case 'mkdir':if(!a[0]||a[0].includes('/'))throw new Error('mkdir accepts one folder name');await api.mkdir(cwd,a[0]);print('Folder created.');break;case 'touch':case 'write':{if(!a[0])throw new Error('Missing path');const {id,name}=await resolve(a[0],true);if(cmd==='touch'&&(await entries()).some(i=>i.parent===id&&i.name===name))break;if(cmd==='write'&&(await entries()).some(i=>i.parent===id&&i.name===name)&&!confirm('Replace '+a[0]+'?'))throw new Error('Cancelled');await api.write(id,name,cmd==='touch'?'':a.slice(1).join(' '));print('Saved '+a[0]);break}case 'cat':if(!a[0])throw new Error('Missing path');print(await api.read(await resolve(a[0])));break;case 'rm':if(!a[0])throw new Error('Missing path');if(confirm('Move '+a[0]+' to Trash?')){await api.trash(await resolve(a[0]));print('Moved to Trash.')}break;case 'fetch':if(!a[0])throw new Error('Missing HTTPS URL');print((await api.network(a[0])).slice(0,120000));break;case 'clone':if(!a[0])throw new Error('Usage: clone owner/repo [dir] [branch]');await clone(...a);break;case 'install':if(!a[0])throw new Error('Usage: install path.html [name]');print('Installed '+await api.install(await resolve(a[0]),a[1]||a[0].split('/').pop().replace(/\.html?$/i,'')));break;case 'apps':print(api.apps().map(i=>i.id+'  '+i.name).join('\n'));break;case 'open':if(!a[0])throw new Error('Missing app ID');api.open(a[0]);break;default:throw new Error('Unknown command: '+cmd+'. Type help.')}}async function run(line){if(busy)return;busy=true;q('#run').disabled=true;q('#input').disabled=true;print((await path(cwd))+' $ '+line,'command');try{await execute(line)}catch(e){print('Error: '+e.message+(e instanceof TypeError?' (network/CORS errors cannot be bypassed)':''),'error')}finally{busy=false;q('#run').disabled=false;q('#input').disabled=false;q('#prompt').textContent=(await path(cwd))+' $';q('#input').focus()}}q('#form').onsubmit=e=>{e.preventDefault();const line=q('#input').value.trim();if(!line)return;history.push(line);position=history.length;q('#input').value='';run(line)};q('#input').onkeydown=e=>{if(e.key==='ArrowUp'){e.preventDefault();position=Math.max(0,position-1);e.target.value=history[position]||''}if(e.key==='ArrowDown'){e.preventDefault();position=Math.min(history.length,position+1);e.target.value=history[position]||''}};q('#help').onclick=()=>run('help');q('#clear').onclick=()=>{if(!busy)out.replaceChildren()};q('#settings').onclick=()=>{if(api)api.open('settings')};print('UBos Terminal 1.7\nLocal virtual files only. Internet and unstable installs default to off. Type help.');if(!api){print('Open this app from the main UBos desktop.','error');q('#input').disabled=q('#run').disabled=true}q('#input').focus();
</script><script src="liquid-buttons.js"></script></body></html>
